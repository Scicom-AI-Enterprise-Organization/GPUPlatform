# GPUPlatform gateway API-layer observability stack:
#   Prometheus (RED metrics) + Loki (request logs) + Promtail (log shipper)
#   + Grafana (the "GPUPlatform — API Layer" dashboard).
#
# Self-contained — does NOT depend on any cluster's Grafana. It scrapes the local
# gateway's /metrics and tails the gateway's JSON access log.
#
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# The gateway runs on the host (.venv/bin/gateway on :8080), so from inside these
# bridged containers we reach it at host.docker.internal:8080 via the host-gateway
# alias. Run the gateway with JSON logs teed to files Promtail can tail (access +
# serverless-endpoint vLLM logs):
#
#   LOG_JSON=1 \
#     GATEWAY_ACCESS_LOG=deploy/monitoring/logs/gateway-access.log \
#     GATEWAY_ENDPOINT_LOG=deploy/monitoring/logs/endpoint.log \
#     .venv/bin/gateway
#
# Grafana:    http://localhost:3001  (admin / admin on first boot)
# Prometheus: http://localhost:9091
# ⚠ Explicit project name. Compose otherwise derives it from the parent DIRECTORY
# ("monitoring"), which this file shares with SlurmUI's stack
# (~/Documents/SlurmUI/monitoring/docker-compose.monitoring.yml) — so a plain
# `docker compose -f deploy/monitoring/... up|down` here silently adopted and could
# tear down THAT stack's Prometheus/Loki/Grafana. Same class of collision as the
# :8080/:3000 host-port ones.
name: gpuplatform-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]

  # Routes firing alerts to receivers (Slack/Telegram/webhook — configure in
  # alertmanager/alertmanager.yml). UI at http://localhost:9093.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks: [monitoring]

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # The gateway's JSON access log, teed to a host file via GATEWAY_ACCESS_LOG.
      - ./logs:/logs:ro
      - promtailpos:/promtail
    depends_on: [loki]
    networks: [monitoring]

  # Distributed tracing store for LLM-proxy requests. The gateway exports one span
  # per proxied request over OTLP (PROXY_TRACING=1) and — when the Queue tab is
  # reading from traces (PROXY_HISTORY_SOURCE=trace / PROXY_REQUEST_STORE≠all) —
  # queries it back through :3200. This is what lets `proxy_requests` stop being a
  # row per request in Postgres.
  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempodata:/var/tempo
    ports:
      # ⚠ Host ports are overridable, and OTLP/HTTP defaults to 4418 rather than the
      # standard 4318 ON PURPOSE: 4318 is already squatted on this laptop (same class
      # of collision as :8080/:3000). Inside the compose network Tempo still listens on
      # the standard ports — only the host mapping moves.
      - "${TEMPO_QUERY_PORT:-3200}:3200"        # query API → TEMPO_URL=http://localhost:3200
      - "${TEMPO_OTLP_HTTP_PORT:-4418}:4318"    # OTLP/HTTP → OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4418
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"    # OTLP/gRPC
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSONs live in deploy/grafana (shared with the helm chart).
      - ../grafana:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    networks: [monitoring]

networks:
  monitoring:
    driver: bridge

volumes:
  promdata:
  lokidata:
  tempodata:
  promtailpos:
  grafanadata:
  alertmanagerdata:
